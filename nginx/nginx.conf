# Frontend SBMG - HTTP (port 80). HTTPS via ssl.conf when certs exist.
# API proxy to backend (host port 8000) - use actual backend ip

upstream backend {
    server host.docker.internal:8000;
}

# Define allowed origins for CORS and CSRF protection
map $http_origin $cors_allow_origin {
    default "";
    "~^https?://(10\.70\.232\.147|localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
    "~^https?://([a-zA-Z0-9.-]+\.)?gov\.in(:[0-9]+)?$" $http_origin;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com; frame-src https://maps.googleapis.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    
    # --------------------------------------------------------
    # FIX: Issue 4 - Hidden Directory Detected
    # Map 403 (Forbidden) to 404 (Not Found) globally to 
    # obscure directory existence from attackers.
    # --------------------------------------------------------
    error_page 403 =404 /index.html;

    # Block TRACE globally
    if ($request_method = TRACE) { return 405; }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location /api/ {
        limit_except GET HEAD POST PUT PATCH {
            deny all;
        }

        # --------------------------------------------------------
        # FIX: Issue 3 - Basic Nginx CSRF Mitigation
        # If an Origin header is present but doesn't match our allowed list, 
        # reject the request. (Protects against browser-based CSRF)
        # --------------------------------------------------------
        if ($http_origin != "") {
            set $block_csrf 1;
        }
        if ($cors_allow_origin != "") {
            set $block_csrf 0;
        }
        if ($block_csrf = 1) {
            return 403 "Forbidden - Invalid Origin";
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        if ($cors_allow_origin) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }
    }

    location / {
        # Restrict root to GET/HEAD only
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # FIX: Issue 4 - Explicitly deny direct directory access to /assets/
    # --------------------------------------------------------
    location ^~ /assets/ {
        # If the exact file isn't found, drop to 404. Prevents directory listing natively.
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}